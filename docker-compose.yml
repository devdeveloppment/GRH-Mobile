version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: grh-mobile-postgres
    environment:
      POSTGRES_DB: grh_mobile
      POSTGRES_USER: grh
      POSTGRES_PASSWORD: grhpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grh -d grh_mobile"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
