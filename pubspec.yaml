name: grh_mobile
description: Template Flutter enterprise pour GRH-Mobile, plateforme GRH B2B/SaaS pour les PME togolaises.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0
  go_router: ^13.2.0
  fl_chart: ^0.67.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  shimmer: ^3.0.0
  file_picker: ^8.0.3
  open_filex: ^4.4.1
  image_picker: ^1.1.2
  flutter_pdfview: ^1.3.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  lottie: ^3.1.0
  flutter_dotenv: ^5.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  crypto: ^3.0.3
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
    - assets/images/grh_logo.png
