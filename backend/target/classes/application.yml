spring:
  application:
    name: grh-mobile-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grh_mobile}
    username: ${DB_USERNAME:grh}
    password: ${DB_PASSWORD:grhpassword}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me-1234567890}
    access-token-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
    inactivity-timeout-minutes: ${AUTO_LOGOUT_MINUTES:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
  aws:
    region: ${AWS_REGION:eu-west-3}
    s3-bucket: ${AWS_S3_BUCKET:grh-mobile-documents}
    cloud-front-domain: ${AWS_CLOUDFRONT_DOMAIN:}
