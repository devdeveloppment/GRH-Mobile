spring:
  application:
    name: grh-mobile-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grh_mobile}
    username: ${DB_USERNAME:grh}
    password: ${DB_PASSWORD:grhpassword}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      static-locations:
        - classpath:/static/
        - file:uploads/

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  upload:
    dir: ${UPLOAD_DIR:uploads/photos}
    inactivity-timeout-minutes: ${AUTO_LOGOUT_MINUTES:30}
  ai:
    # Assistant RH : desactive par defaut. Activation = AI_ENABLED=true + ANTHROPIC_API_KEY (jamais dans Git).
    enabled: ${AI_ENABLED:false}
    model: ${AI_MODEL:claude-opus-5-5}
    max-iterations: ${AI_MAX_ITERATIONS:5}
  demo:
    # Utilise uniquement avec le profil Spring "demo" (jamais en production).
    password: ${DEMO_PASSWORD:}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
    nom: ${BOOTSTRAP_ADMIN_LAST_NAME:Super}
    prenom: ${BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@grh-mobile.com}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    reset-password-on-startup: ${BOOTSTRAP_ADMIN_RESET_PASSWORD:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  aws:
    region: ${AWS_REGION:eu-west-3}
    s3-bucket: ${AWS_S3_BUCKET:grh-mobile-documents}
    cloud-front-domain: ${AWS_CLOUDFRONT_DOMAIN:}
